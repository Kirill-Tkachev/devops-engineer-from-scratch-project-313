events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;

        root /app/public;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
        }

        location /r/ {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}